[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hs-dlpc410"
version = "0.1.0"
description = "DLP7000 BMP and DDR2 sequence control for FPGA ABI D201"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["dlpc410"]

[tool.setuptools.package-data]
dlpc410 = ["*.ps1"]
